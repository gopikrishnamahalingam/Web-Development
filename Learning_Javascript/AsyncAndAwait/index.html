<!-- 
Task
Mini Project: Fake Student Data Loader
Build a small webpage that has:
A "Load Students" button.
Initially, show nothing except the button.
When clicked, simulate fetching student data from a server using a Promise and setTimeout.
While the data is "loading", display:
Loading students...
After 2 seconds, display a list of students.
Each student should have:
Name
Age
Course
Add a possibility for the simulated request to fail.
If it fails, display an appropriate error message instead.
Use async/await.
Handle the failure using try/catch. 
-->
