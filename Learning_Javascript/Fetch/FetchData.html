<!-- 
Goal: Build a small web page that fetches users from a public API and displays them as profile cards.

Requirements
1. Fetch user data from https://jsonplaceholder.typicode.com/users.
2. Display each user's name, email, and city.
3. Show a loading message while the data is being fetched.
4. Display an appropriate error message if the request fails.
5. Handle unsuccessful HTTP responses correctly.
6. Add a Reload Users button that fetches the data again.
7. Make sure the page doesn't display duplicate cards after reloading.

Constraints
- Use only HTML, CSS, and vanilla JavaScript.
- Use fetch() with async/await.
- Use try/catch for error handling.
- No frameworks or libraries.
- Don't worry about making the design fancy; focus on functionality. 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Data</title>
    <link rel="stylesheet" href="FetchData.css">
</head>
<body>
    <button class="btn"> Fetch Data </button>
    <p class="message"></p>
    <div class="container"></div>
    <script src="FetchData.js"></script>
</body>
</html>
