<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        Student Form
    </div>
        <form class="studentForm" action="">
                <label class="label" for="Name">Name:</label>
                <input type="text" name="Name" id="Name" placeholder="Enter student name">
                <label class="label" for="Age">Age: </label>
                <input type="number" name="Age" id="Age" placeholder="Eneter student age">
                <label class="label" for="Course">Course:</label>
                <select name="Course" id="Course">
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                    <option value="C++">C++</option>
                    <option value="JavaScript">JavaScript</option>
            </select>
            <button class="btn1" type="submit">Add student</button>
            <p class="Error"> </p>
            
        </form>
        <table class="table">
            <tr>
                <th>Sr. No</th>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
            </tr>

        </table>

        <div class="Scards">Student Cards</div>
        <div class="container">

        </div>
        <script src="script.js"></script>
</body>
</html>
