<!-- 
Task 
Create an expense tracker.
Users should be able to:
Add an expense
Specify its name
Specify its amount
View all expenses
Delete an expense
See total expenditure 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Expense Statistics -->
    <aside class="expenseStatistic"> 
        <div class="Statistics">
            <h2>Statistics</h2>
            <div>
                <label>Total No of Expenses: </label>
                <label class="totalNoOfExpense"></label>
            </div>
            <div>
                <label>Total Expenses: </label>
                <label class="totalExpense"></label>
            </div>
            <div>
                <label>Highest Expense: </label>
                <label class="highestExpense"></label>
            </div>
            <div>
                <label>Spent on: </label>
                <label class="highestExpenseBy"></label>
            </div>
            <div>
                <label>Lowest Expense: </label>
                <label class="lowestExpense"></label>
            </div>
            <div>
                <label>Spent on: </label>
                <label class="lowestExpenseBy"></label>
            </div>
        </div>
        <div class="Filters">
            <h2>Filters</h2>
            <div>Sort By: 
                <select name="sortByFilter" id="sortByFilter">
                    <option value="reset">reset</option>
                    <option value="NameAsc">Name Asc to Desc</option>
                    <option value="NameDesc">Name Desc to Asc</option>
                    <option value="AmountLH">Amount Low to High</option>
                    <option value="AmountHL">Amount High to Low</option>
                    <option value="NtO">New to Old (Most Recent first)</option>
                    <option value="OtN">Old to New (Chronological)</option>
                </select>
            </div>
            <div>Select Date: <input type="date" name="sortByDate" id="sortByDate">
            </div>
            <div class="statisticBtnDiv">
                <button class=" ExpenseBtn resetAllFilters">Reset All Filters</button>
            </div>
            <div class="statisticBtnDiv">
                 <button class="resetExpenseBtn ExpenseBtn">Reset Everything</button>
            </div>
        </div>
    </aside>


    <!-- Main Section -->
    <section class="mainSection">
        <h1>Expense Tracker</h1>
        <div class="mainFunctions">
            <input type="text" name="searchExpense" id="searchExpense" placeholder="Search your Expense">
            <button class="searchExpenseBtn ExpenseBtn">Search</button>
            <button class="addExpenseBtn ExpenseBtn">Add</button>
        </div>
        <div class="expenseContainer"></div>
    </section>
    
    
    <script src="script.js"></script>
</body>
</html>
