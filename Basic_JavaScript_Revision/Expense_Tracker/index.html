<!-- 
Task 
Create an expense tracker.
Users should be able to:
Add an expense
Specify its name
Specify its amount
View all expenses
Delete an expense
See total expenditure 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Expense Statistics -->
    <aside class="expenseStatistic"> 
        <h2>Statistics</h2>
        <div>
            <label>Total Expenses: </label>
        </div>
        <div>
            <label>Highest Expense: </label>
        </div>
        <div>
            <label>Spent on: </label>
        </div>
        <div>
            <label>Lowest Expense: </label>
        </div>
        <div>
            <label>Spent on: </label>
        </div>
    </aside>


    <!-- Main Section -->
    <section class="mainSection">
        <div class="mainFunctions">
            <input type="text" name="searchExpense" id="searchExpense" placeholder="Search your Expense">
            <button class="searchExpenseBtn ExpenseBtn">Search</button>
            <button class="addExpenseBtn ExpenseBtn">Add</button>
            <button class="resetExpenseBtn ExpenseBtn">Reset</button>
        </div>
        <div class="expenseContainer"></div>
    </section>
    
    
    <script src="script.js"></script>
</body>
</html>
