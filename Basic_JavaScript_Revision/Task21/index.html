<!-- 
Task
Create a webpage containing an input for a user's name and a button.
When the button is pressed, display a personalized greeting on the webpage.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greet</title>
    <style>
        body{
            padding: 20px;
        }
    </style>
</head>
<body>
    <form class="form" action="">
        <label for="Name">Name</label>
        <input type="text" name="Name" id="Name" placeholder="Enter your name">
        <button class="btn" type="submit">Get Message</button>
        <label class="Special_Message" for="Special_Message"></label>
    </form>

    <script src="script.js"></script>
</body>
</html>
