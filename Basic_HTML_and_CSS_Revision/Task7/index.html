<!--
Task
Create a profile card containing:
Image
Name
Profession
Short description
Three skills
Contact button
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img class="MyPic" src="../Photos/MyPic.jpeg" alt="MyPic">
        <div>
            Gopikrishna Mahalingam
        </div>
        <div>
            Java Full Stack Developer
        </div>
        <div>
            A Java Full Stack Developer builds and maintains both the client-side front-end and the server-side back-end of web applications using Java as the primary core language.
        </div>
        <div class="btns">
            <div>
                <button>Java</button>
                <button>SQL</button>
                <button>JavaScript</button>
            </div>
            <div>
                <button class="Contact">Contact</button>
            </div>
        </div>
    </div>
    
</body>
</html>
